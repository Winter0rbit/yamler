run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused

linters-settings:
  misspell:
    locale: US

issues:
  exclude-rules:
    # Tests deliberately ignore errors from calls whose failure is the
    # subject of a later assertion.
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
